<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kote Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #070913;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #1e293b;
            z-index: 30;
        }
        .balance-box {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .tab-btns {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            background: #1e293b;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        
        .game-screen {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .space-bg {
            position: absolute;
            width: 100%;
            height: 200%;
            background-image: radial-gradient(white 1.5px, transparent 0), radial-gradient(rgba(56,189,248,0.5) 1px, transparent 0);
            background-size: 50px 50px, 30px 30px;
            opacity: 0.4;
            z-index: 1;
        }
        .space-bg.animating {
            animation: scrollStars 4s linear infinite;
        }
        @keyframes scrollStars {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        .multiplier-display {
            font-size: 52px;
            font-weight: 900;
            color: #22c55e;
            z-index: 10;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.5);
            margin-top: -60px;
        }
        .status-text {
            font-size: 15px;
            color: #38bdf8;
            z-index: 10;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }

        .players-lobby {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 350px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 8px 12px;
            z-index: 25;
            box-sizing: border-box;
            max-height: 100px;
            overflow-y: auto;
        }
        .lobby-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .lobby-player {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
        .lobby-player span:last-child {
            color: #22c55e;
            font-weight: bold;
        }

        /* Rocket Flight Zone container */
        .rocket-flight-zone {
            position: absolute;
            bottom: 20px;
            width: 170px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.15s ease-out;
        }
        .rocket-svg-container {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.5));
        }

        /* Perfectly Centered & Dimensioned Cat Image Overlay */
        .rocket-cat-img {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 65px;
            object-fit: contain;
            z-index: 15;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
        }

        .leaderboard-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 19, 0.95);
            z-index: 40;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .leaderboard-panel.open {
            display: flex;
        }
        .lb-title {
            font-size: 18px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 15px;
            text-align: center;
        }
        .lb-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        .lb-item {
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .lb-rank {
            font-weight: bold;
            color: #38bdf8;
            width: 30px;
        }
        .lb-name {
            flex-grow: 1;
            color: #f8fafc;
            font-weight: 500;
        }
        .lb-score {
            color: #22c55e;
            font-weight: bold;
        }

        .controls {
            width: 100%;
            padding: 16px 20px 24px 20px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid #1e293b;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 30;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bet-row label {
            font-size: 14px;
            color: #94a3b8;
        }
        .bet-input {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 16px;
            width: 110px;
            text-align: right;
            font-weight: bold;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }
        .action-btn.cashout {
            background: #eab308;
            color: #000;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.4);
        }
        .action-btn:disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; color: #f8fafc;">🐱 Kote Crash</div>
        <div class="tab-btns">
            <button class="tab-btn active" id="gameTabBtn" onclick="switchTab('game')">Game</button>
            <button class="tab-btn" id="lbTabBtn" onclick="switchTab('leaderboard')">🏆 Leaderboard</button>
        </div>
        <div class="balance-box">💰 <span id="balance">10000</span></div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="space-bg" id="spaceBg"></div>
        
        <div class="players-lobby">
            <div class="lobby-title">👥 Active Players in Round:</div>
            <div id="lobbyList">
                <div class="lobby-player"><span>No bets placed yet</span><span>-</span></div>
            </div>
        </div>

        <div class="multiplier-display" id="multDisplay">1.00x</div>
        <div class="status-text" id="statusText">Next round starts in 10s... Place your bet!</div>

        <!-- Rocket Container with Properly Centered Cat Image -->
        <div class="rocket-flight-zone" id="rocketZone">
            <img src="cat.png" alt="Kote Cat" class="rocket-cat-img" onerror="this.style.display='none'">
            <svg class="rocket-svg-container" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <g id="flames" style="display: none;">
                    <path d="M120,230 L150,300 L180,230 Z" fill="#ef4444"/>
                    <path d="M130,235 L150,280 L170,235 Z" fill="#f97316"/>
                    <path d="M140,240 L150,260 L160,240 Z" fill="#facc15"/>
                </g>
                <path d="M150,40 C190,90 190,180 170,220 L130,220 C110,180 110,90 150,40 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
                <ellipse cx="150" cy="45" rx="15" ry="10" fill="#e2e8f0"/>
                <path d="M115,180 L80,210 L115,220 Z" fill="#64748b"/>
                <path d="M185,180 L220,210 L185,220 Z" fill="#64748b"/>
                <rect x="125" y="110" width="50" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
                <text x="150" y="131" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">0x0</text>
                <text x="150" y="85" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle" transform="rotate(90, 150, 85)">KOTE ROCKET</text>
            </svg>
        </div>
    </div>

    <div class="leaderboard-panel" id="lbPanel">
        <div class="lb-title">🏆 Chat Leaderboard</div>
        <div class="lb-list" id="lbList"></div>
    </div>

    <div class="controls">
        <div class="bet-row">
            <label>Bet Amount (Tokens):</label>
            <input type="number" id="betInput" class="bet-input" value="100" min="10" max="10000">
        </div>
        <button id="actionBtn" class="action-btn" onclick="handleButtonClick()">PLACE BET FOR NEXT ROUND 🚀</button>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === 'function') {
            tg.expand();
        }

        const telegramUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) 
            ? (tg.initDataUnsafe.user.username ? `@${tg.initDataUnsafe.user.username}` : tg.initDataUnsafe.user.first_name) 
            : "KoteCadet";

        let balance = 10000;
        let currentBet = 100;
        let gameState = 'WAITING';
        let multiplier = 1.00;
        let crashAt = 1.00;
        let countdown = 10;
        let timerInterval = null;
        let gameInterval = null;
        let flightHeight = 0;
        let hasPlacedBet = false;

        const balanceEl = document.getElementById('balance');
        const betInput = document.getElementById('betInput');
        const multDisplay = document.getElementById('multDisplay');
        const statusText = document.getElementById('statusText');
        const actionBtn = document.getElementById('actionBtn');
        const rocketZone = document.getElementById('rocketZone');
        const spaceBg = document.getElementById('spaceBg');
        const flames = document.getElementById('flames');
        const gameScreen = document.getElementById('gameScreen');
        const lbPanel = document.getElementById('lbPanel');
        const lbList = document.getElementById('lbList');
        const lobbyList = document.getElementById('lobbyList');

        let activePlayers = [];
        let leaderboard = [];
        try {
            leaderboard = JSON.parse(localStorage.getItem('kote_lb')) || [
                { name: telegramUser + " 🐱", score: "2.50x" }
            ];
        } catch (e) {
            leaderboard = [];
        }

        function switchTab(tab) {
            if (tab === 'game') {
                gameScreen.style.display = 'flex';
                lbPanel.classList.remove('open');
                document.getElementById('gameTabBtn').classList.add('active');
                document.getElementById('lbTabBtn').classList.remove('active');
            } else {
                gameScreen.style.display = 'none';
                lbPanel.classList.add('open');
                document.getElementById('lbTabBtn').classList.add('active');
                document.getElementById('gameTabBtn').classList.remove('active');
                renderLeaderboard();
            }
        }

        function renderLeaderboard() {
            lbList.innerHTML = '';
            leaderboard.sort((a, b) => parseFloat(b.score) - parseFloat(a.score));
            leaderboard.forEach((item, index) => {
                lbList.innerHTML += `
                    <div class="lb-item">
                        <div class="lb-rank">#${index + 1}</div>
                        <div class="lb-name">${item.name}</div>
                        <div class="lb-score">${item.score}</div>
                    </div>
                `;
            });
        }

        function startLobbyCountdown() {
            if (timerInterval) clearInterval(timerInterval);
            if (gameInterval) clearInterval(gameInterval);

            gameState = 'WAITING';
            countdown = 10;
            hasPlacedBet = false;
            multiplier = 1.00;
            multDisplay.innerText = "1.00x";
            multDisplay.style.color = "#22c55e";
            actionBtn.innerText = "PLACE BET FOR NEXT ROUND 🚀";
            actionBtn.className = "action-btn";
            betInput.disabled = false;
            rocketZone.style.transform = 'translate(0, 0)';

            activePlayers = [];
            updateLobbyUI();

            timerInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    statusText.innerText = `Next round starts in ${countdown}s... Place your bet!`;
                } else {
                    clearInterval(timerInterval);
                    launchFlight();
                }
            }, 1000);
        }

        function updateLobbyUI() {
            lobbyList.innerHTML = '';
            activePlayers.forEach(p => {
                lobbyList.innerHTML += `<div class="lobby-player"><span>${p.name}</span><span>${p.bet} tokens</span></div>`;
            });
            if (activePlayers.length === 0) {
                lobbyList.innerHTML = `<div class="lobby-player"><span>No bets placed yet</span><span>-</span></div>`;
            }
        }

        function handleButtonClick() {
            if (gameState === 'WAITING') {
                if (hasPlacedBet) return;
                currentBet = parseInt(betInput.value);
                if (isNaN(currentBet) || currentBet <= 0) {
                    alert("Please enter a valid bet amount!");
                    return;
                }
                if (currentBet > balance) {
                    alert("Not enough tokens!");
                    return;
                }

                balance -= currentBet;
                balanceEl.innerText = balance;
                hasPlacedBet = true;

                activePlayers.push({ name: telegramUser + " 🐱", bet: currentBet });
                updateLobbyUI();

                actionBtn.innerText = "BET LOCKED ✅ (Waiting for Launch)";
                actionBtn.disabled = true;
                betInput.disabled = true;
            } else if (gameState === 'FLYING') {
                cashOut();
            }
        }

        function launchFlight() {
            gameState = 'FLYING';
            crashAt = parseFloat((Math.random() * 6 + 1.3).toFixed(2));
            flightHeight = 0;

            if (hasPlacedBet) {
                actionBtn.innerText = "CLAIM / CASH OUT 💰";
                actionBtn.className = "action-btn cashout";
                actionBtn.disabled = false;
            } else {
                actionBtn.innerText = "WATCHING ROUND 🚀";
                actionBtn.disabled = true;
            }

            statusText.innerText = "Rocket lifting off through space!";
            flames.style.display = 'block';
            spaceBg.classList.add('animating');

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                multiplier += 0.035;
                multDisplay.innerText = multiplier.toFixed(2) + 'x';

                if (flightHeight < 140) flightHeight += 1.5;
                let randomShake = (Math.random() - 0.5) * 6;
                rocketZone.style.transform = `translate(${randomShake}px, ${-flightHeight}px) rotate(${randomShake * 0.5}deg)`;

                if (multiplier >= crashAt) {
                    crashGame();
                }
            }, 75);
        }

        function cashOut() {
            if (gameInterval) clearInterval(gameInterval);
            gameState = 'CASHED_OUT';
            spaceBg.classList.remove('animating');
            flames.style.display = 'none';

            let winnings = Math.floor(currentBet * multiplier);
            balance += winnings;
            balanceEl.innerText = balance;

            multDisplay.style.color = "#38bdf8";
            statusText.innerHTML = `<b style="color: #38bdf8;">🎉 Cashed out! Won +${winnings} tokens!</b>`;
            actionBtn.innerText = "NEXT ROUND IN 3S...";
            actionBtn.disabled = true;
            rocketZone.style.transform = 'translate(0, 0)';

            leaderboard.push({ name: telegramUser + " 🐱", score: multiplier.toFixed(2) + "x" });
            try {
                localStorage.setItem('kote_lb', JSON.stringify(leaderboard));
            } catch (e) {}

            if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.notificationOccurred === 'function') {
                tg.HapticFeedback.notificationOccurred('success');
            }
            setTimeout(startLobbyCountdown, 3000);
        }

        function crashGame() {
            if (gameInterval) clearInterval(gameInterval);
            gameState = 'CRASHED';
            spaceBg.classList.remove('animating');
            flames.style.display = 'none';

            multDisplay.style.color = "#ef4444";
            multDisplay.innerText = multiplier.toFixed(2) + 'x';
            
            if (hasPlacedBet) {
                statusText.innerHTML = `<b style="color: #ef4444;">💥 CRASHED! Lost ${currentBet} tokens.</b>`;
            } else {
                statusText.innerHTML = `<b style="color: #ef4444;">💥 ROCKET CRASHED at ${multiplier.toFixed(2)}x!</b>`;
            }
            
            actionBtn.innerText = "NEXT ROUND IN 3S...";
            actionBtn.disabled = true;
            rocketZone.style.transform = 'translate(0, 0)';
            
            if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.notificationOccurred === 'function') {
                tg.HapticFeedback.notificationOccurred('error');
            }

            setTimeout(startLobbyCountdown, 3000);
        }

        startLobbyCountdown();
    </script>
</body>
</html>
