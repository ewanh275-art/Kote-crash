<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kote Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #1e293b;
            z-index: 30;
        }
        .balance-box {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .tab-btns {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            background: #1e293b;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        
        .game-screen {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Clean Space Background */
        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: 
                radial-gradient(circle at 25% 25%, rgba(147, 51, 234, 0.22) 0%, transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(56, 189, 248, 0.18) 0%, transparent 45%),
                #05070e;
            z-index: 1;
        }

        /* Isolated Glowing Stars */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            z-index: 2;
            opacity: 0.85;
            pointer-events: none;
        }
        .star-1 { width: 3px; height: 3px; top: 18%; left: 20%; box-shadow: 0 0 6px #fff; }
        .star-2 { width: 2px; height: 2px; top: 65%; left: 82%; box-shadow: 0 0 4px #fff; }
        .star-3 { width: 4px; height: 4px; top: 30%; left: 78%; box-shadow: 0 0 8px #fff; }

        /* Floating Planets */
        .planet {
            position: absolute;
            border-radius: 50%;
            z-index: 2;
            opacity: 0.65;
            pointer-events: none;
        }
        .planet-1 {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, #f97316, #7c2d12);
            top: 12%;
            right: 12%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 15px rgba(249, 115, 22, 0.4);
        }
        .planet-2 {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1);
            bottom: 25%;
            left: 10%;
            box-shadow: inset -8px -8px 15px rgba(0,0,0,0.8), 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .multiplier-display {
            font-size: 52px;
            font-weight: 900;
            color: #22c55e;
            z-index: 10;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
            position: absolute;
            top: 70px;
        }
        .status-text {
            font-size: 14px;
            color: #38bdf8;
            z-index: 10;
            position: absolute;
            top: 135px;
            font-weight: bold;
            text-align: center;
            width: 90%;
        }

        .players-lobby {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 350px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 8px 12px;
            z-index: 25;
            box-sizing: border-box;
            max-height: 90px;
            overflow-y: auto;
        }
        .lobby-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .lobby-player {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
        .lobby-player span:last-child {
            color: #22c55e;
            font-weight: bold;
        }

        /* Rocket Flight Zone starting at Bottom-Left */
        .rocket-flight-zone {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.1s ease-out;
        }
        .rocket-svg-container {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
        }

        /* Cockpit Cat Image with Emoji Fallback */
        .rocket-cat-container {
            position: absolute;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            z-index: 15;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        .rocket-cat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .leaderboard-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 14, 0.96);
            z-index: 40;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .leaderboard-panel.open {
            display: flex;
        }
        .lb-title {
            font-size: 18px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 15px;
            text-align: center;
        }
        .lb-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        .lb-item {
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .lb-rank {
            font-weight: bold;
            color: #38bdf8;
            width: 30px;
        }
        .lb-name {
            flex-grow: 1;
            color: #f8fafc;
            font-weight: 500;
        }
        .lb-score {
            color: #22c55e;
            font-weight: bold;
        }

        .controls {
            width: 100%;
            padding: 16px 20px 24px 20px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid #1e293b;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 30;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bet-row label {
            font-size: 14px;
            color: #94a3b8;
        }
        .bet-input {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 16px;
            width: 110px;
            text-align: right;
            font-weight: bold;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }
        .action-btn.cashout {
            background: #eab308;
            color: #000;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.4);
        }
        .action-btn:disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; color: #f8fafc;">🐱 Kote Crash</div>
        <div class="tab-btns">
            <button class="tab-btn active" id="gameTabBtn" onclick="switchTab('game')">Game</button>
            <button class="tab-btn" id="lbTabBtn" onclick="switchTab('leaderboard')">🏆 Leaderboard</button>
        </div>
        <div class="balance-box">💰 <span id="balance">10000</span></div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="space-bg"></div>
        <div class="star star-1"></div>
        <div class="star star-2"></div>
        <div class="star star-3"></div>
        <div class="planet planet-1"></div>
        <div class="planet planet-2"></div>
        
        <div class="players-lobby">
            <div class="lobby-title">👥 Active Players in Round:</div>
            <div id="lobbyList">
                <div class="lobby-player"><span>No bets placed yet</span><span>-</span></div>

        <div class="multiplier-display" id="multDisplay">1.00x</div>

        <div class="rocket-flight-zone" id="rocketZone">

            </div>
            <svg class="rocket-svg-container" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <g id="flames" style="display: none;">
