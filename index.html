<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kote Crash Diagnostic</title>
    <script>
        // Catch any silent JavaScript crash and display it on the screen
        window.onerror = function(msg, url, line) {
            document.body.innerHTML += `<div style="background:red;color:white;padding:20px;margin:10px;z-index:99999;position:relative;"><b>ERROR:</b> ${msg} <br>Line: ${line}</div>`;
        };
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #070913;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
        }
        .box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🐱 Kote Diagnostic Mode</h1>
    <div class="box">
        <p>If you see this, HTML & JavaScript are running successfully!</p>
        <p><strong>Checking cat.png status:</strong></p>
        <img src="cat.png" alt="Cat Test" width="100" onerror="this.outerHTML='<p style=\'color:red;\'>❌ cat.png failed to load from the root folder!</p>'">
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            alert("Telegram WebApp connected successfully as: " + (tg.initDataUnsafe?.user?.first_name || "Unknown"));
        } else {
            alert("Opened outside Telegram (Standard browser mode).");
        }
    </script>
</body>
</html>
