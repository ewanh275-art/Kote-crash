<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kote Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #070913;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid #1e293b;
            z-index: 30;
        }
        .balance-box {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .tab-btns {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            background: #1e293b;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        
        .game-screen {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .space-bg {
            position: absolute;
            width: 100%;
            height: 200%;
            background-image: radial-gradient(white 1.5px, transparent 0), radial-gradient(rgba(56,189,248,0.5) 1px, transparent 0);
            background-size: 50px 50px, 30px 30px;
            opacity: 0.4;
            z-index: 1;
        }
        .space-bg.animating {
            animation: scrollStars 4s linear infinite;
        }
        @keyframes scrollStars {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        .multiplier-display {
            font-size: 52px;
            font-weight: 900;
            color: #22c55e;
            z-index: 10;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.5);
            margin-top: -60px;
        }
        .status-text {
            font-size: 15px;
            color: #38bdf8;
            z-index: 10;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }

        .players-lobby {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 350px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 8px 12px;
            z-index: 25;
            box-sizing: border-box;
            max-height: 100px;
            overflow-y: auto;
        }
        .lobby-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .lobby-player {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
        .lobby-player span:last-child {
            color: #22c55e;
            font-weight: bold;
        }

        .rocket-flight-zone {
            position: absolute;
            bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: transform 0.15s ease-out;
        }
        .rocket-svg-container {
            width: 170px;
            height: 170px;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.5));
        }

        .leaderboard-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 19, 0.95);
            z-index: 40;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .leaderboard-panel.open {
            display: flex;
        }
        .lb-title {
            font-size: 18px;
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 15px;
            text-align: center;
        }
        .lb-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        .lb-item {
            background: #1e293b;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }
        .lb-rank {
            font-weight: bold;
            color: #38bdf8;
            width: 30px;
        }
        .lb-name {
            flex-grow: 1;
            color: #f8fafc;
            font-weight: 500;
        }
        .lb-score {
            color: #22c55e;
            font-weight: bold;
        }

        .controls {
            width: 100%;
            padding: 16px 20px 24px 20px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid #1e293b;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 30;
        }
        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bet-row label {
            font-size: 14px;
            color: #94a3b8;
        }
        .bet-input {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 16px;
            width: 110px;
            text-align: right;
            font-weight: bold;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
        }
        .action-btn.cashout {
            background: #eab308;
            color: #000;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.4);
        }
        .action-btn:disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; color: #f8fafc;">🐱 Kote Crash</div>
        <div class="tab-btns">
            <button class="tab-btn active" id="gameTabBtn" onclick="switchTab('game')">Game</button>
            <button class="tab-btn" id="lbTabBtn" onclick="switchTab('leaderboard')">🏆 Leaderboard</button>
        </div>
        <div class="balance-box">💰 <span id="balance">10000</span></div>
    </div>

    <div class="game-screen" id="gameScreen">
        <div class="space-bg" id="spaceBg"></div>
        
        <!-- Active Real Players Lobby -->
        <div class="players-lobby">
            <div class="lobby-title">👥 Active Players in Round:</div>
            <div id="lobbyList">
                <div class="lobby-player"><span>No bets placed yet</span><span>-</span></div>
            </div>
        </div>

        <div class="multiplier-display" id="multDisplay">1.00x</div>
        <div class="status-text" id="statusText">Next round starts in 10s... Place your bet!</div>

        <!-- Rocket with your exact cat.png image embedded -->
        <div class="rocket-flight-zone" id="rocketZone">
            <svg class="rocket-svg-container" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Flames -->
                <g id="flames" style="display: none;">
                    <path d="M120,230 L150,300 L180,230 Z" fill="#ef4444"/>
                    <path d="M130,235 L150,280 L170,235 Z" fill="#f97316"/>
                    <path d="M140,240 L150,260 L160,240 Z" fill="#facc15"/>
                </g>
                <!-- Rocket Body -->
                <path d="M150,40 C190,90 190,180 170,220 L130,220 C110,180 110,90 150,40 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="3"/>
                <ellipse cx="150" cy="45" rx="15" ry="10" fill="#e2e8f0"/>
                <path d="M115,180 L80,210 L115,220 Z" fill="#64748b"/>
                <path d="M185,180 L220,210 L185,220 Z" fill="#64748b"/>
                <rect x="125" y="110" width="50" height="30" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
                <text x="150" y="131" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">0x0</text>
                <text x="150" y="85" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle" transform="rotate(90, 150, 85)">KOTE ROCKET</text>
                
                <!-- YOUR EXACT CAT IMAGE (cat.png) RIDING ON THE ROCKET -->
                <image href="cat.png" x="105" y="15" width="90" height="90" preserveAspectRatio="xMidYMid meet"/>
            </svg>
        </div>
    </div>

    <div class="leaderboard-panel" id="lbPanel">
        <div class="lb-title">🏆 Chat Leaderboard</div>
        <div class="lb-list" id="lbList"></div>
    </div>

    <div class="controls">
        <div class="bet-row">
            <label>Bet Amount (Tokens):</label>
            <input type="number" id="betInput" class="bet-input" value="100" min="10" max="10000">
        </div>
        <button id="actionBtn" class="action-btn" onclick="handleButtonClick()">PLACE BET FOR NEXT ROUND 🚀</button>
    </div>
