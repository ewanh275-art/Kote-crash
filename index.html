<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kote Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #38bdf8;
            font-size: 32px;
        }
        .multiplier {
            font-size: 48px;
            font-weight: bold;
            color: #22c55e;
            margin: 20px 0;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🐱🚀 Kote Crash</h1>
    <div class="multiplier" id="mult">1.00x</div>
    <p id="status">Tap below to test the game!</p>
    <button onclick="testLaunch()">LAUNCH ROCKET</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function testLaunch() {
            let mult = 1.00;
            document.getElementById('status').innerText = "Rocket climbing...";
            let interval = setInterval(() => {
                mult += 0.25;
                document.getElementById('mult').innerText = mult.toFixed(2) + 'x';
                if (mult >= 3.00) {
                    clearInterval(interval);
                    document.getElementById('status').innerHTML = '<b style="color: #ef4444;">💥 CRASHED AT 3.00x!</b>';
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }, 300);
        }
    </script>
</body>
</html>
