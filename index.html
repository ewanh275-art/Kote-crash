<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kote Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05070e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            width: 100%;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #1e293b;
            z-index: 30;
        }
        .balance-box {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .tab-btns {
            display: flex;
            gap: 8px;
        }
        .tab-btn {
            background: #1e293b;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }
        
        .game-screen {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Stunning Space Background with Nebulas & Stars */
        .space-bg {
            position: absolute;
            width: 100%;
            height: 300%;
            top: -100%;
            background: 
                radial-gradient(circle at 30% 20%, rgba(147, 51, 234, 0.2) 0%, transparent 35%),
                radial-gradient(circle at 70% 60%, rgba(56, 189, 248, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 30%),
                radial-gradient(white 1.2px, transparent 0),
                radial-gradient(rgba(56,189,248,0.7) 1px, transparent 0);
            background-size: 100% 100%, 100% 100%, 100% 100%, 50px 50px, 35px 35px;
            opacity: 0.8;
            z-index: 1;
        }
        .space-bg.animating {
            animation: scrollSpace 6s linear infinite;
        }
        @keyframes scrollSpace {
            0% { transform: translateY(0); }
            100% { transform: translateY(33.33%); }
        }

        /* Planet Elements floating in background */
        .planet {
            position: absolute;
            border-radius: 50%;
            z-index: 2;
            opacity: 0.6;
            pointer-events: none;
        }
        .planet-1 {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #f97316, #7c2d12);
            top: 15%;
            right: 10%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 15px rgba(249, 115, 22, 0.4);
        }
        .planet-2 {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1);
            top: 45%;
            left: 8%;
            box-shadow: inset -8px -8px 15px rgba(0,0,0,0.8), 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .multiplier-display {
            font-size: 52px;
            font-weight: 900;
            color: #22c55e;
            z-index: 10;
            text-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
            position: absolute;
            top: 70px;
        }
        .status-text {
            font-size: 14px;
            color: #38bdf8;
            z-index: 10;
            position: absolute;
            top: 135px;
            font-weight: bold;
            text-align: center;
            width: 90%;
        }

        .players-lobby {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 350px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 8px 12px;
            z-index: 25;
            box-sizing: border-box;
            max-height: 90px;
            overflow-y: auto;
        }
        .lobby-title {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .lobby-player {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
        .lobby-player span:last-child {
            color: #22c55e;
            font-weight: bold;
        }
